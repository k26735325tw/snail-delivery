<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>店家專區 | GoGet 蝸牛外送</title>
    <meta name="description" content="GoGet 蝸牛外送店家專區。">
    <link rel="stylesheet" href="/assets/css/style.css">
  </head>
  <body data-page="merchant">
    <header class="site-header">
      <div class="site-wrap site-header__inner">
        <a class="brand" href="/">
          <img id="site-logo" class="brand__logo" src="/images/logo.png" alt="GoGet 蝸牛外送品牌標誌">
          <div class="brand__meta">
            <span id="site-name" class="brand__name">GoGet 蝸牛外送</span>
            <span id="site-subtitle" class="brand__subtitle">台灣本土最友善的外送平台</span>
          </div>
        </a>
        <button id="nav-toggle" class="nav-toggle" type="button" aria-label="切換導覽選單" aria-expanded="false">
          <span class="nav-toggle__bars" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
        <nav id="site-nav" class="site-nav" aria-label="主要導覽"></nav>
        <div class="header__actions">
          <a id="header-cta" class="btn btn--primary desktop-only" href="#download-cards">立即下載 App</a>
        </div>
      </div>
    </header>
    <main class="page-shell">
      <div class="site-wrap">
        <div id="page-error" class="error-banner" hidden></div>
        <section class="hero">
          <div class="panel hero__panel">
            <div class="hero__grid">
              <div class="hero__copy">
                <span id="hero-badge" class="eyebrow">店家專區</span>
                <h1 id="hero-title"></h1>
                <p id="hero-subtitle" class="hero__subtitle"></p>
                <div id="hero-badges" class="hero__badge-row"></div>
                <div id="hero-actions" class="hero__actions"></div>
                <div id="hero-stats" class="hero__stats"></div>
              </div>
              <div id="hero-visual" class="hero__visual"></div>
            </div>
          </div>
        </section>
        <section id="sections-section" class="section">
          <div class="section__head">
            <div>
              <span class="eyebrow">Sections</span>
              <h2 class="section-title">內容區</h2>
            </div>
          </div>
          <div id="sections-grid" class="role-grid"></div>
        </section>
        <section id="blocks-section" class="section">
          <div class="section__head">
            <div>
              <span class="eyebrow">Blocks</span>
              <h2 class="section-title">自訂內容區</h2>
            </div>
          </div>
          <div id="blocks-grid" class="block-grid"></div>
        </section>
      </div>
    </main>
    <footer class="footer">
      <div class="site-wrap">
        <div class="panel footer__panel">
          <div class="footer__grid">
            <div class="footer__brand">
              <span class="eyebrow">GoGet</span>
              <h2 id="footer-title" class="section-title"></h2>
              <p id="footer-desc"></p>
            </div>
            <div id="footer-groups" class="footer__links"></div>
            <div class="footer__links">
              <h3>交接版本</h3>
              <ul>
                <li>HTML + PHP</li>
                <li>不需要 Next.js</li>
                <li>內容存在 JSON</li>
              </ul>
            </div>
          </div>
          <div class="footer__bottom">
            <span id="footer-note"></span>
          </div>
        </div>
      </div>
    </footer>
    <script src="/assets/js/site.js"></script>
  </body>
</html>
